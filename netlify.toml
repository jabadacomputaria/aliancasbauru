# Netlify: publica só a pasta public/. O resto do repositório (configuração, notas) não vai ao ar.
[build]
  publish = "public"

# Endereços curtos
[[redirects]]
  from = "/links"
  to = "/links.html"
  status = 200

[[redirects]]
  from = "/privacidade"
  to = "/privacidade.html"
  status = 200

# Cabeçalhos de segurança para todas as páginas.
# Os dois sha256 liberam só o selo "Powered by Netlify" do plano grátis (script e estilo do iframe do selo).
# Se o Netlify mudar o selo, ele deixa de aparecer e o console mostra os novos hashes para trocar aqui.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; style-src 'self' 'sha256-3y5TlF5zG6/2W5bLJcFMMnGWSDYZMPAJMXGh07elcnY='; img-src 'self' data:; font-src 'self'; frame-src https://www.google.com https://maps.google.com; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
